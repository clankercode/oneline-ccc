name: Windows installer tests
on:
  pull_request:
jobs:
  installer:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run installer harness
        shell: ${{ matrix.shell }}
        run: ./tests/run.ps1
