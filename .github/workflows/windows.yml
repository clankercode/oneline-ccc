name: Windows installer tests
on:
  pull_request:
jobs:
  installer:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install and load native Codex
        shell: pwsh
        env:
          LLMP_API_KEY: fixture-only-not-a-real-credential
        run: |
          & '${{ matrix.shell }}' -NoProfile -ExecutionPolicy Bypass -File tests/native-smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native Codex smoke test failed' }
      - name: Run installer harness
        shell: pwsh
        run: |
          & '${{ matrix.shell }}' -NoProfile -ExecutionPolicy Bypass -File tests/run.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer harness failed' }
          & '${{ matrix.shell }}' -NoProfile -ExecutionPolicy Bypass -File tests/ssh.ps1
          if ($LASTEXITCODE -ne 0) { throw 'SSH harness failed' }
