name: Publish site and installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Windows installer
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test installer
        shell: pwsh
        run: |
          & '${{ matrix.shell }}' -NoProfile -ExecutionPolicy Bypass -File tests/run.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer harness failed' }
      - name: Install and load native Codex with a dummy credential
        shell: pwsh
        env:
          LLMP_API_KEY: fixture-only-not-a-real-credential
        run: |
          & '${{ matrix.shell }}' -NoProfile -ExecutionPolicy Bypass -File tests/native-smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native Codex smoke test failed' }

  deploy:
    name: Deploy verified site
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage standalone installer
        run: cp scripts/setup-codex.ps1 site/setup-codex.ps1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-download:
    name: Verify public one-liner
    needs: deploy
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Load the hosted installer as a scriptblock
        shell: pwsh
        run: |
          & '${{ matrix.shell }}' -NoProfile -ExecutionPolicy Bypass -File tests/public-download-smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Public download smoke test failed' }
