name: Publish site and installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  verify-preview:
    name: Verify TUI preview journeys
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Test preview state and module syntax
        run: |
          node --test tests/tui-preview-state.test.mjs
          for module in site/tui-*.mjs site/tui-preview.js; do node --check "$module"; done
      - name: Install pinned browser test tooling
        run: |
          npm install --prefix .cache/browser --no-save playwright@1.61.1
          .cache/browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Exercise browser journeys
        env:
          TUI_PREVIEW_URL: http://127.0.0.1:8765/tui-preview.html
          PLAYWRIGHT_MODULE: ../.cache/browser/node_modules/playwright/index.mjs
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory site >.cache/browser/server.log 2>&1 &
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8765/tui-preview.html >/dev/null; then break; fi
            sleep 1
          done
          node tests/tui-preview-browser.mjs

  verify:
    name: Verify Windows installer
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test SSH plans and safety checks offline
        shell: pwsh
        run: |
          & '${{ matrix.shell }}' -NoProfile -ExecutionPolicy Bypass -File tests/ssh.ps1
          if ($LASTEXITCODE -ne 0) { throw 'SSH harness failed' }
      - name: Install and load native Codex with a dummy credential
        shell: pwsh
        env:
          LLMP_API_KEY: fixture-only-not-a-real-credential
        run: |
          & '${{ matrix.shell }}' -NoProfile -ExecutionPolicy Bypass -File tests/native-smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Native Codex smoke test failed' }

      - name: Test installer
        shell: pwsh
        run: |
          & '${{ matrix.shell }}' -NoProfile -ExecutionPolicy Bypass -File tests/run.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Installer harness failed' }

  verify-ssh:
    name: Verify real Windows SSH setup
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH, authenticate locally, and check failure rollback
        shell: powershell
        run: ./tests/ssh-native-smoke.ps1

  verify-ssh-fresh:
    name: Verify fresh Windows SSH setup
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Generate hostkeys and authenticate as the current administrator
        shell: powershell
        run: ./tests/ssh-native-fresh-smoke.ps1
      - name: Reuse existing administrator-generated hostkeys and authenticate
        shell: powershell
        run: ./tests/ssh-native-fresh-smoke.ps1 -SeedExistingHostKeys

  deploy:
    name: Deploy verified site
    needs: [verify-preview, verify, verify-ssh, verify-ssh-fresh]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Stage standalone installer
        run: |
          cp scripts/setup-codex.ps1 site/setup-codex.ps1
          cp scripts/setup-ssh-server.ps1 site/setup-ssh-server.ps1
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-download:
    name: Verify public one-liner
    needs: deploy
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Load the hosted installer as a scriptblock
        shell: pwsh
        run: |
          & '${{ matrix.shell }}' -NoProfile -ExecutionPolicy Bypass -File tests/public-download-smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Public download smoke test failed' }
